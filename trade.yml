name: Deriv Trading Bot

on:
  schedule:
    - cron: '*/15 * * * *'   # runs roughly every 15 minutes - GitHub does not guarantee exact timing
  workflow_dispatch:          # lets you also trigger it manually from the GitHub website, for testing

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install ws

      - name: Run the bot
        env:
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
        run: node bot.js

      - name: Save updated trade state back to the repo
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@example.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update trade state"
          git push
